all:
  children:
    inference:
      hosts:
        x99:
          # The X99 box (hostname kabangy) manages itself.
          ansible_host: localhost
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
    # Proxmox guests on vmbr0 (10.10.10.0/24). Reached from the jobs LXC (10.10.10.13);
    # from elsewhere, go through Tailscale.
    radeon:
      hosts:
        llm-radeon:
          ansible_host: 10.10.10.11
          ansible_user: james
          ansible_ssh_private_key_file: ~/.ssh/homelab
          ansible_python_interpreter: /usr/bin/python3
