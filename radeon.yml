---
# llm-radeon VM: kernel, ROCm 6.3.3, Radeon VII power cap.
# Create the VM first (proxmox/terraform), then from the jobs LXC:
#   .venv/bin/ansible-playbook radeon.yml
#   .venv/bin/ansible-playbook radeon.yml --tags verify

- name: Radeon VII VM
  hosts: radeon
  become: true
  roles:
    - role: rocm
      tags: [rocm]
    - role: amdgpu_power
      tags: [amdgpu]
