---
tailscale_apt_key_url: https://pkgs.tailscale.com/stable/ubuntu/jammy.noarmor.gpg
tailscale_apt_repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu jammy main"

# Supply via ansible-vault (inventory/host_vars/x99/vault.yml). If empty, the role
# installs tailscaled and leaves login to you (`sudo tailscale up --ssh`).
tailscale_authkey: ""
tailscale_ssh: true
tailscale_hostname: "{{ inventory_hostname }}"
tailscale_extra_args: []
