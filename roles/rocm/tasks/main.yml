---
- name: Install a kernel that ships amdgpu
  ansible.builtin.apt:
    name: "{{ rocm_kernel_package }}"
    update_cache: true
  register: rocm_kernel

- name: Reboot into the new kernel
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: rocm_kernel is changed

- name: ROCm apt key
  ansible.builtin.get_url:
    url: https://repo.radeon.com/rocm/rocm.gpg.key
    dest: /etc/apt/keyrings/rocm.asc
    mode: "0644"

- name: ROCm apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/rocm.list
    mode: "0644"
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.asc] https://repo.radeon.com/rocm/apt/{{ rocm_version }} noble main

# Prefer AMD's repo over Ubuntu universe's older ROCm 5.x packages.
- name: Pin repo.radeon.com
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/rocm-pin-600
    mode: "0644"
    content: |
      Package: *
      Pin: release o=repo.radeon.com
      Pin-Priority: 600

- name: Install ROCm (large download)
  ansible.builtin.apt:
    name: rocm
    update_cache: true

- name: ROCm libraries on the loader path
  ansible.builtin.copy:
    dest: /etc/ld.so.conf.d/rocm.conf
    mode: "0644"
    content: "/opt/rocm/lib\n"
  register: rocm_ld

- name: Run ldconfig
  ansible.builtin.command: ldconfig
  when: rocm_ld is changed
  changed_when: true

- name: GPU access for users
  ansible.builtin.user:
    name: "{{ item }}"
    groups: [render, video]
    append: true
  loop: "{{ rocm_users }}"

- name: Check the GPU is visible
  ansible.builtin.shell: /opt/rocm/bin/rocminfo | grep -m1 -o 'gfx906'
  register: rocm_gfx
  changed_when: false
  failed_when: rocm_gfx.stdout != 'gfx906'
  tags: [verify]
