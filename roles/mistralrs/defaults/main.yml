---
mistralrs_repo: https://github.com/EricLBuehler/mistral.rs.git
# Upstream master on 2026-09-27 (0.9.4), the base of the local gemma4-ple-cpu branch.
mistralrs_version: 2370966bb91e2e3dafa0b1521b87c50fd5c01244
mistralrs_dest: "{{ homelab_user_home }}/src/mistral.rs"
# 17-line patch from kvsnap: MISTRALRS_GEMMA4_PLE_CPU=1 keeps Gemma 4's
# per-layer embedding table in host RAM (-1.85 GB VRAM).
mistralrs_apply_ple_patch: true
mistralrs_cuda_compute_cap: "75"   # Turing / sm_75
mistralrs_build_jobs: 8
# ~55 min on the E5-2678 v3. Async timeout in seconds.
mistralrs_build_timeout: 10800
